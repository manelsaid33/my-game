<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Shooter</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#050816;color:white;
  font-family:Arial,sans-serif;
  display:flex;justify-content:center;align-items:center;
  min-height:100vh
}
#game{width:min(900px,96vw);position:relative}
canvas{
  width:100%;display:block;background:#030712;
  border:2px solid #159cff;border-radius:15px
}
#hud{
  position:absolute;top:12px;left:12px;right:12px;
  display:flex;justify-content:space-between;
  flex-wrap:wrap;gap:7px;pointer-events:none
}
.box{
  background:#07101ddd;border:1px solid #ffffff22;
  border-radius:10px;padding:8px 12px;font-weight:bold
}
#menu{
  position:absolute;inset:0;display:flex;
  justify-content:center;align-items:center;
  background:#02050cdd;border-radius:15px;text-align:center
}
.panel{
  width:min(430px,90%);padding:28px;
  background:#0b1427;border:1px solid #2196ff55;
  border-radius:20px
}
h1{color:#54c7ff;text-shadow:0 0 15px #008cff}
button{
  border:0;padding:13px 22px;margin:5px;
  border-radius:10px;background:#2196ff;color:white;
  font-weight:bold;cursor:pointer
}
button:hover{background:#42b4ff}
.help{color:#9aa8bd;font-size:13px;line-height:1.6}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas" width="900" height="550"></canvas>

<div id="hud">
  <div class="box">❤️ HP: <span id="hp">100</span></div>
  <div class="box">⭐ Score: <span id="score">0</span></div>
  <div class="box">🪙 Coins: <span id="coins">0</span></div>
  <div class="box">🌊 Wave: <span id="wave">1</span></div>
  <div class="box">🔫 <span id="weapon">Blaster</span></div>
</div>

<div id="menu">
  <div class="panel">
    <h1 id="title">NEON SHOOTER</h1>
    <p id="message">Survive the enemy waves!</p>

    <button id="start">START GAME</button>

    <p class="help">
      WASD / Arrow Keys = Move<br>
      SPACE = Shoot<br>
      Mouse Click = Shoot<br>
      1 = Blaster | 2 = Spread | 3 = Laser
    </p>
  </div>
</div>

</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const hpText=document.getElementById("hp");
const scoreText=document.getElementById("score");
const coinsText=document.getElementById("coins");
const waveText=document.getElementById("wave");
const weaponText=document.getElementById("weapon");

const menu=document.getElementById("menu");
const title=document.getElementById("title");
const message=document.getElementById("message");
const start=document.getElementById("start");

let running=false;
let score=0;
let coins=0;
let hp=100;
let wave=1;
let weapon=1;

let bullets=[];
let enemies=[];
let enemyBullets=[];
let particles=[];
let keys={};

let spawnTimer=0;
let lastTime=0;

const player={
  x:450,
  y:480,
  r:18,
  speed:330
};

const stars=[];

for(let i=0;i<120;i++){
  stars.push({
    x:Math.random()*900,
    y:Math.random()*550,
    s:20+Math.random()*80
  });
}

function updateHUD(){

  hpText.textContent=Math.max(0,Math.floor(hp));
  scoreText.textContent=score;
  coinsText.textContent=coins;
  waveText.textContent=wave;

  weaponText.textContent=
    weapon===1?"Blaster":
    weapon===2?"Spread":"Laser";
}

function reset(){

  running=true;

  score=0;
  coins=0;
  hp=100;
  wave=1;
  weapon=1;

  bullets=[];
  enemies=[];
  enemyBullets=[];
  particles=[];

  spawnTimer=0;

  player.x=450;
  player.y=480;

  updateHUD();

  menu.style.display="none";

  lastTime=performance.now();

  requestAnimationFrame(loop);
}

function shoot(tx,ty){

  if(!running)return;

  const dx=tx-player.x;
  const dy=ty-player.y;

  const base=Math.atan2(dy,dx);

  let angles=[0];

  if(weapon===2){
    angles=[-.2,0,.2];
  }

  for(const offset of angles){

    const a=base+offset;

    bullets.push({
      x:player.x,
      y:player.y,
      vx:Math.cos(a)*650,
      vy:Math.sin(a)*650,
      r:weapon===3?6:4,
      damage:weapon===3?3:1,
      life:1
    });

  }
}

function spawnEnemy(){

  const r=Math.random();

  let e;

  if(r<.4){

    e={
      type:"fast",
      x:Math.random()*900,
      y:-30,
      r:13,
      hp:1,
      speed:150,
      color:"#ffd23f",
      damage:8
    };

  }else if(r<.75){

    e={
      type:"tank",
      x:Math.random()*900,
      y:-40,
      r:25,
      hp:7+wave,
      speed:35,
      color:"#a66cff",
      damage:20
    };

  }else{

    e={
      type:"shooter",
      x:Math.random()*900,
      y:-30,
      r:17,
      hp:2,
      speed:55,
      color:"#ff426d",
      damage:10,
      cooldown:1.5
    };

  }

  enemies.push(e);
}

function damage(n){

  hp-=n;

  if(hp<=0){

    hp=0;
    gameOver();

  }

  updateHUD();
}

function gameOver(){

  running=false;

  menu.style.display="flex";

  title.textContent="GAME OVER";

  message.textContent=
    "Score: "+score+
    " | Wave: "+wave+
    " | Coins: "+coins;

  start.textContent="PLAY AGAIN";
}

function explosion(x,y,color){

  for(let i=0;i<12;i++){

    particles.push({
      x:x,
      y:y,
      vx:(Math.random()-.5)*200,
      vy:(Math.random()-.5)*200,
      life:.5,
      color:color
    });

  }
}

function update(dt){

  if(keys["ArrowLeft"]||keys["a"])
    player.x-=player.speed*dt;

  if(keys["ArrowRight"]||keys["d"])
    player.x+=player.speed*dt;

  if(keys["ArrowUp"]||keys["w"])
    player.y-=player.speed*dt;

  if(keys["ArrowDown"]||keys["s"])
    player.y+=player.speed*dt;

  player.x=Math.max(20,Math.min(880,player.x));
  player.y=Math.max(70,Math.min(530,player.y));

  for(const star of stars){

    star.y+=star.s*dt;

    if(star.y>550)star.y=0;

  }

  spawnTimer-=dt;

  if(spawnTimer<=0){

    spawnEnemy();

    spawnTimer=Math.max(.25,.9-wave*.04);

  }

  for(const b of bullets){

    b.x+=b.vx*dt;
    b.y+=b.vy*dt;
    b.life-=dt;

  }

  bullets=bullets.filter(b=>
    b.life>0 &&
    b.x>-30 &&
    b.x<930 &&
    b.y>-30 &&
    b.y<580
  );

  for(const e of enemies){

    e.y+=e.speed*dt;

    if(e.type==="shooter"){

      e.cooldown-=dt;

      if(e.cooldown<=0){

        const a=Math.atan2(
          player.y-e.y,
          player.x-e.x
        );

        enemyBullets.push({
          x:e.x,
          y:e.y,
          vx:Math.cos(a)*180,
          vy:Math.sin(a)*180,
          r:6
        });

        e.cooldown=1.5;
      }
    }
  }

  for(const b of enemyBullets){

    b.x+=b.vx*dt;
    b.y+=b.vy*dt;

    if(
      Math.hypot(
        b.x-player.x,
        b.y-player.y
      )<b.r+player.r
    ){

      damage(8);
      b.x=-999;

    }
  }

  enemyBullets=enemyBullets.filter(b=>
    b.x>-30&&b.x<930&&b.y>-30&&b.y<580
  );

  for(let i=enemies.length-1;i>=0;i--){

    const e=enemies[i];

    if(e.y>600){

      damage(e.damage);

      enemies.splice(i,1);

      continue;
    }

    if(
      Math.hypot(
        e.x-player.x,
        e.y-player.y
      )<e.r+player.r
    ){

      damage(e.damage);

      enemies.splice(i,1);

    }

  }

  for(let i=enemies.length-1;i>=0;i--){

    const e=enemies[i];

    for(let j=bullets.length-1;j>=0;j--){

      const b=bullets[j];

      if(
        Math.hypot(
          e.x-b.x,
          e.y-b.y
        )<e.r+b.r
      ){

        e.hp-=b.damage;

        bullets.splice(j,1);

        if(e.hp<=0){

          explosion(
            e.x,
            e.y,
            e.color
          );

          score+=
            e.type==="tank"?50:
            e.type==="shooter"?30:15;

          coins+=
            e.type==="tank"?3:1;

          enemies.splice(i,1);

        }

        break;
      }

    }

  }

  if(score>=wave*300){

    wave++;

    hp=Math.min(100,hp+15);

  }

  for(const p of particles){

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.life-=dt;

  }

  particles=particles.filter(p=>p.life>0);

  updateHUD();
}

function draw(){

  ctx.clearRect(
    0,0,
    canvas.width,
    canvas.height
  );

  ctx.fillStyle="#030712";

  ctx.fillRect(
    0,0,
    canvas.width,
    canvas.height
  );

  for(const star of stars){

    ctx.fillStyle="#7ec8ff88";

    ctx.fillRect(
      star.x,
      star.y,
      2,
      2
    );

  }

  ctx.strokeStyle="#159cff12";

  for(let x=0;x<900;x+=50){

    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,550);
    ctx.stroke();

  }

  for(let y=0;y<550;y+=50){

    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(900,y);
    ctx.stroke();

  }

  for(const b of bullets){

    ctx.fillStyle=
      weapon===3?"white":"#4de8ff";

    ctx.shadowBlur=15;
    ctx.shadowColor=ctx.fillStyle;

    ctx.beginPath();

    ctx.arc(
      b.x,b.y,b.r,
      0,Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;
  }

  for(const b of enemyBullets){

    ctx.fillStyle="#ff527c";

    ctx.beginPath();

    ctx.arc(
      b.x,b.y,b.r,
      0,Math.PI*2
    );

    ctx.fill();

  }

  for(const e of enemies){

    ctx.fillStyle=e.color;

    ctx.shadowBlur=20;
    ctx.shadowColor=e.color;

    ctx.beginPath();

    ctx.arc(
      e.x,e.y,e.r,
      0,Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

  }

  ctx.save();

  ctx.translate(
    player.x,
    player.y
  );

  ctx.fillStyle="#54c7ff";

  ctx.shadowBlur=25;
  ctx.shadowColor="#008cff";

  ctx.beginPath();

  ctx.moveTo(0,-25);
  ctx.lineTo(20,20);
  ctx.lineTo(0,12);
  ctx.lineTo(-20,20);
  ctx.closePath();

  ctx.fill();

  ctx.restore();

  for(const p of particles){

    ctx.globalAlpha=Math.max(
      0,
      p.life*2
    );

    ctx.fillStyle=p.color;

    ctx.fillRect(
      p.x,
      p.y,
      4,
      4
    );

  }

  ctx.globalAlpha=1;
}

function loop(time){

  if(!running)return;

  const dt=Math.min(
    .033,
    (time-lastTime)/1000
  );

  lastTime=time;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

start.addEventListener(
  "click",
  reset
);

window.addEventListener(
  "keydown",
  e=>{

    keys[e.key]=true;

    if(e.key==="1")weapon=1;
    if(e.key==="2")weapon=2;
    if(e.key==="3")weapon=3;

    if(e.code==="Space"&&running){

      e.preventDefault();

      shoot(
        player.x,
        player.y-300
      );
    }

    updateHUD();

  }
);

window.addEventListener(
  "keyup",
  e=>{
    keys[e.key]=false;
  }
);

canvas.addEventListener(
  "mousedown",
  e=>{

    if(!running)return;

    const rect=
      canvas.getBoundingClientRect();

    const x=
      (e.clientX-rect.left)
      *canvas.width/rect.width;

    const y=
      (e.clientY-rect.top)
      *canvas.height/rect.height;

    shoot(x,y);

  }
);

updateHUD();
draw();

</script>

</body>
</html>
